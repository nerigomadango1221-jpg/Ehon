<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101a3c">
<title>おとのずかん</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#101a3c; }
  body {
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Hiragino Sans","Yu Gothic",sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none;
    -webkit-text-size-adjust:100%;
  }
  #app { position:fixed; inset:0; overflow:hidden; }

  /* ---- 場面 ---- */
  .scene { position:absolute; inset:0; opacity:0; visibility:hidden; transition:opacity .45s ease; }
  .scene.active { opacity:1; visibility:visible; }
  .art { position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* ---- エフェクト用キャンバス ---- */
  #fx { position:absolute; inset:0; pointer-events:none; }

  /* ---- タップで出る文字 ---- */
  #word {
    position:absolute; left:50%; top:18%; transform:translate(-50%,-50%);
    font-size:clamp(56px, 13vmin, 150px); font-weight:800; letter-spacing:.06em;
    color:#fff; opacity:0; pointer-events:none; white-space:nowrap;
    text-shadow:0 0 18px rgba(0,0,0,.35), 0 6px 0 rgba(0,0,0,.18);
    -webkit-text-stroke:6px rgba(0,0,0,.18);
    paint-order:stroke fill;
  }
  #word.pop { animation:pop 1.15s cubic-bezier(.2,1.5,.4,1) forwards; }
  @keyframes pop {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(-8deg); }
    18%  { opacity:1; transform:translate(-50%,-50%) scale(1.18) rotate(3deg); }
    32%  { transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    75%  { opacity:1; transform:translate(-50%,-50%) scale(1); }
    100% { opacity:0; transform:translate(-50%,-52%) scale(1.02); }
  }

  /* ---- 場面の名前 ---- */
  #label {
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom, 0px) + 84px);
    padding:8px 22px; border-radius:999px;
    background:rgba(255,255,255,.82); color:#3a3550;
    font-size:22px; font-weight:700; letter-spacing:.08em;
    pointer-events:none;
  }

  /* ---- ページ送り ---- */
  .arrow {
    position:absolute; top:50%; transform:translateY(-50%);
    width:78px; height:78px; border:none; border-radius:50%;
    background:rgba(255,255,255,.34); color:#fff; font-size:34px; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  }
  .arrow:active { background:rgba(255,255,255,.6); }
  #prev { left:calc(env(safe-area-inset-left, 0px) + 14px); }
  #next { right:calc(env(safe-area-inset-right, 0px) + 14px); }

  #dots {
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom, 0px) + 34px);
    display:flex; gap:14px;
  }
  .dot { width:14px; height:14px; border-radius:50%; background:rgba(255,255,255,.45); transition:transform .2s, background .2s; }
  .dot.on { background:#fff; transform:scale(1.45); }

  /* ---- はじめる画面 ---- */
  #start {
    position:absolute; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:26px; cursor:pointer;
    background:radial-gradient(circle at 50% 38%, #37417f 0%, #141c44 70%);
    color:#fff; text-align:center;
  }
  #start h1 { font-size:clamp(40px, 9vmin, 88px); font-weight:800; letter-spacing:.1em; }
  #start p { font-size:clamp(18px, 3.4vmin, 26px); opacity:.85; letter-spacing:.06em; }
  #start .ring { width:22vmin; height:22vmin; border-radius:50%; background:rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center; font-size:11vmin;
    animation:breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform:scale(1); } 50% { transform:scale(1.09); } }
  #start.hide { opacity:0; visibility:hidden; transition:opacity .4s, visibility .4s; }

  /* ---- 場面ごとの動き ---- */
  .twinkle { animation:twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity:.35; } 50% { opacity:1; } }
  .drift { animation:drift 26s linear infinite; }
  @keyframes drift { from { transform:translateX(-140px); } to { transform:translateX(560px); } }
  .sway { transform-origin:center bottom; animation:sway 3.2s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform:rotate(-1.6deg); } 50% { transform:rotate(1.6deg); } }
  .wobble { animation:wobble .7s ease-in-out; }
  @keyframes wobble {
    0% { transform:translate(0,0) rotate(0); }
    20% { transform:translate(0,-10px) rotate(-3deg); }
    45% { transform:translate(0,4px) rotate(2.5deg); }
    70% { transform:translate(0,-5px) rotate(-1.5deg); }
    100% { transform:translate(0,0) rotate(0); }
  }
  .hop { animation:hop .75s cubic-bezier(.3,1.6,.5,1); }
  @keyframes hop {
    0% { transform:translateY(0) scaleY(1); }
    15% { transform:translateY(0) scaleY(.78) scaleX(1.12); }
    45% { transform:translateY(-16%) scaleY(1.05) scaleX(.95); }
    75% { transform:translateY(0) scaleY(.9) scaleX(1.06); }
    100% { transform:translateY(0) scaleY(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .twinkle, .drift, .sway, #start .ring { animation:none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="scenes"></div>
  <canvas id="fx"></canvas>
  <div id="word"></div>
  <div id="label"></div>
  <button id="prev" class="arrow" aria-label="まえのページ">◀</button>
  <button id="next" class="arrow" aria-label="つぎのページ">▶</button>
  <div id="dots"></div>
  <div id="start">
    <h1>おとのずかん</h1>
    <div class="ring">✨</div>
    <p>がめんを タップして はじめる</p>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ============ 場面データ ============ */
  var stars = "";
  var seed = 7;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  for (var i = 0; i < 46; i++) {
    var sx = (rnd() * 400).toFixed(1), sy = (rnd() * 300).toFixed(1);
    var sr = (0.9 + rnd() * 2.1).toFixed(1), sd = (rnd() * 2.6).toFixed(2);
    stars += '<circle class="twinkle" cx="' + sx + '" cy="' + sy + '" r="' + sr +
             '" fill="#fff" style="animation-delay:' + sd + 's"/>';
  }

  var SCENES = [
    {
      id: "kira", word: "キラキラ", label: "ほしぞら",
      color: "#ffe66d", particle: "star", sound: "kira",
      art:
        '<svg class="art" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">' +
          '<defs><radialGradient id="g_sky" cx="50%" cy="30%" r="80%">' +
            '<stop offset="0%" stop-color="#3b3f8f"/><stop offset="100%" stop-color="#0d1233"/>' +
          '</radialGradient></defs>' +
          '<rect width="400" height="300" fill="url(#g_sky)"/>' + stars +
          '<circle cx="318" cy="62" r="34" fill="#ffeaa0"/>' +
          '<circle cx="303" cy="54" r="30" fill="#3b3f8f" opacity=".0"/>' +
          '<circle cx="305" cy="52" r="8" fill="#f2d98a" opacity=".55"/>' +
          '<circle cx="330" cy="76" r="5" fill="#f2d98a" opacity=".5"/>' +
          '<path d="M0 250 Q70 200 140 246 T280 244 T400 252 L400 300 L0 300 Z" fill="#161a45"/>' +
          '<path d="M0 272 Q100 240 200 270 T400 268 L400 300 L0 300 Z" fill="#0a0d2c"/>' +
        '</svg>'
    },
    {
      id: "pon", word: "ポンポン", label: "ボール",
      color: "#ff6b8a", particle: "ball", sound: "pon", react: ".ballgroup", reactClass: "hop",
      art:
        '<svg class="art" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">' +
          '<rect width="400" height="300" fill="#a7e3c8"/>' +
          '<rect y="0" width="400" height="190" fill="#8fd9f2"/>' +
          '<circle cx="60" cy="42" r="26" fill="#fff8b0"/>' +
          '<ellipse cx="200" cy="212" rx="260" ry="46" fill="#7fd3ad"/>' +
          '<g class="ballgroup" style="transform-origin:center 78%">' +
            '<g><circle cx="132" cy="176" r="34" fill="#ff6b8a"/>' +
              '<path d="M104 160 Q132 178 160 160" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>' +
              '<circle cx="122" cy="164" r="7" fill="#fff" opacity=".65"/></g>' +
            '<g><circle cx="205" cy="188" r="26" fill="#ffd23f"/>' +
              '<circle cx="197" cy="180" r="6" fill="#fff" opacity=".7"/></g>' +
            '<g><circle cx="272" cy="172" r="38" fill="#5b8cff"/>' +
              '<path d="M240 158 Q272 180 304 158" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>' +
              '<circle cx="258" cy="158" r="8" fill="#fff" opacity=".6"/></g>' +
          '</g>' +
        '</svg>'
    },
    {
      id: "buu", word: "ブーブー", label: "くるま",
      color: "#ff8f3f", particle: "puff", sound: "buu", react: ".car", reactClass: "wobble",
      art:
        '<svg class="art" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">' +
          '<rect width="400" height="300" fill="#bfe9ff"/>' +
          '<circle cx="330" cy="48" r="30" fill="#ffe066"/>' +
          '<g class="drift" opacity=".9">' +
            '<ellipse cx="60" cy="60" rx="34" ry="18" fill="#fff"/>' +
            '<ellipse cx="86" cy="56" rx="22" ry="14" fill="#fff"/>' +
          '</g>' +
          '<rect y="196" width="400" height="104" fill="#6b6f7d"/>' +
          '<rect y="188" width="400" height="10" fill="#9aa0ad"/>' +
          '<g stroke="#fff" stroke-width="7" stroke-dasharray="30 26" stroke-linecap="round">' +
            '<line x1="0" y1="248" x2="400" y2="248"/></g>' +
          '<g class="car" style="transform-origin:200px 190px">' +
            '<rect x="110" y="140" width="180" height="56" rx="24" fill="#ff5c5c"/>' +
            '<path d="M150 142 L168 112 L246 112 L266 142 Z" fill="#ff8080"/>' +
            '<rect x="168" y="118" width="34" height="22" rx="6" fill="#d8f4ff"/>' +
            '<rect x="212" y="118" width="34" height="22" rx="6" fill="#d8f4ff"/>' +
            '<circle cx="152" cy="196" r="24" fill="#2f3340"/><circle cx="152" cy="196" r="10" fill="#cfd6e4"/>' +
            '<circle cx="250" cy="196" r="24" fill="#2f3340"/><circle cx="250" cy="196" r="10" fill="#cfd6e4"/>' +
            '<circle cx="288" cy="166" r="8" fill="#ffe066"/>' +
          '</g>' +
        '</svg>'
    },
    {
      id: "basha", word: "バシャバシャ", label: "みずあそび",
      color: "#3fc8ff", particle: "drop", sound: "basha",
      art:
        '<svg class="art" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">' +
          '<rect width="400" height="300" fill="#ffe9c9"/>' +
          '<rect y="96" width="400" height="204" fill="#2aa8e0"/>' +
          '<path class="sway" d="M0 104 Q50 88 100 104 T200 104 T300 104 T400 104 L400 130 L0 130 Z" fill="#6fd0f5"/>' +
          '<path d="M0 150 Q60 136 120 150 T240 150 T400 148 L400 172 L0 172 Z" fill="#4dbde9" opacity=".7"/>' +
          '<path d="M0 214 Q70 198 140 214 T280 214 T400 212 L400 240 L0 240 Z" fill="#1f93c9" opacity=".65"/>' +
          '<ellipse cx="96" cy="256" rx="30" ry="16" fill="#7fe0ff" opacity=".5"/>' +
          '<ellipse cx="300" cy="228" rx="24" ry="12" fill="#7fe0ff" opacity=".45"/>' +
          '<g><ellipse cx="308" cy="188" rx="26" ry="16" fill="#ffb74d"/>' +
            '<path d="M330 188 L350 174 L350 202 Z" fill="#ffa726"/>' +
            '<circle cx="296" cy="184" r="4" fill="#3a2a10"/></g>' +
        '</svg>'
    },
    {
      id: "fuwa", word: "フワフワ", label: "しゃぼんだま",
      color: "#c59bff", particle: "bubble", sound: "fuwa",
      art:
        '<svg class="art" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">' +
          '<defs><linearGradient id="g_fuwa" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="#ffd7f0"/><stop offset="60%" stop-color="#d9e4ff"/>' +
            '<stop offset="100%" stop-color="#bfe6ff"/></linearGradient></defs>' +
          '<rect width="400" height="300" fill="url(#g_fuwa)"/>' +
          '<g opacity=".95">' +
            '<ellipse cx="96" cy="86" rx="46" ry="26" fill="#fff"/>' +
            '<ellipse cx="128" cy="78" rx="30" ry="20" fill="#fff"/>' +
            '<ellipse cx="292" cy="120" rx="40" ry="22" fill="#fff"/>' +
            '<ellipse cx="322" cy="114" rx="26" ry="17" fill="#fff"/>' +
          '</g>' +
          '<g opacity=".6">' +
            '<circle cx="140" cy="200" r="20" fill="none" stroke="#fff" stroke-width="3"/>' +
            '<circle cx="250" cy="168" r="14" fill="none" stroke="#fff" stroke-width="3"/>' +
            '<circle cx="196" cy="246" r="26" fill="none" stroke="#fff" stroke-width="3"/>' +
          '</g>' +
          '<path d="M0 282 Q100 262 200 282 T400 280 L400 300 L0 300 Z" fill="#a8dfa0"/>' +
        '</svg>'
    }
  ];

  /* ============ 画面の組み立て ============ */
  var scenesEl = document.getElementById("scenes");
  var dotsEl = document.getElementById("dots");
  var wordEl = document.getElementById("word");
  var labelEl = document.getElementById("label");
  var startEl = document.getElementById("start");
  var canvas = document.getElementById("fx");
  var ctx = canvas.getContext("2d");
  var current = 0;

  SCENES.forEach(function (s, idx) {
    var d = document.createElement("div");
    d.className = "scene";
    d.innerHTML = s.art;
    scenesEl.appendChild(d);
    s.el = d;
    var dot = document.createElement("div");
    dot.className = "dot";
    dotsEl.appendChild(dot);
    s.dot = dot;
  });

  function show(idx) {
    current = (idx + SCENES.length) % SCENES.length;
    SCENES.forEach(function (s, i) {
      s.el.classList.toggle("active", i === current);
      s.dot.classList.toggle("on", i === current);
    });
    labelEl.textContent = SCENES[current].label;
    particles.length = 0;
  }

  /* ============ 音 ============ */
  var ac = null;
  function audio() {
    if (!ac) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
    }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function env(gain, t, a, d, peak) {
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(peak, t + a);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(type, f0, f1, t, dur, peak, dest) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, 0.012, dur, peak);
    o.connect(g); g.connect(dest || ac.destination);
    o.start(t); o.stop(t + dur + 0.06);
  }
  var noiseBuf = null;
  function noiseBuffer() {
    if (noiseBuf && noiseBuf.sampleRate === ac.sampleRate) return noiseBuf;
    var len = Math.floor(ac.sampleRate);
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    noiseBuf = buf;
    return buf;
  }
  /* ノイズが使えない環境でも他の音が止まらないよう、ここだけ独立して失敗させる */
  function noise(t, dur, f0, f1, peak, q) {
    try {
      var src = ac.createBufferSource();
      src.buffer = noiseBuffer();
      var bp = ac.createBiquadFilter();
      bp.type = "bandpass"; bp.Q = q || 1;
      bp.frequency.setValueAtTime(f0, t);
      bp.frequency.linearRampToValueAtTime(f1, t + dur);
      var g = ac.createGain();
      env(g, t, 0.02, dur, peak);
      src.connect(bp); bp.connect(g); g.connect(ac.destination);
      src.start(t, Math.random() * 0.4);
      src.stop(t + dur + 0.05);
    } catch (e) {}
  }

  var SOUNDS = {
    kira: function (t) {
      var notes = [1046, 1318, 1568, 2093, 2637];
      for (var i = 0; i < 5; i++) {
        tone("sine", notes[i], notes[i], t + i * 0.075, 0.32, 0.16);
        tone("triangle", notes[i] * 2, notes[i] * 2, t + i * 0.075, 0.18, 0.05);
      }
    },
    pon: function (t) {
      tone("sine", 620, 180, t, 0.16, 0.42);
      tone("sine", 900, 300, t + 0.16, 0.13, 0.26);
      tone("sine", 1200, 480, t + 0.29, 0.1, 0.16);
    },
    buu: function (t) {
      var lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1600;
      lp.connect(ac.destination);
      tone("sawtooth", 250, 250, t, 0.26, 0.16, lp);
      tone("sawtooth", 315, 315, t, 0.26, 0.14, lp);
      tone("sawtooth", 250, 250, t + 0.34, 0.3, 0.16, lp);
      tone("sawtooth", 315, 315, t + 0.34, 0.3, 0.14, lp);
    },
    basha: function (t) {
      for (var i = 0; i < 2; i++) {
        var s = t + i * 0.26;
        tone("sine", 1100, 260, s, 0.15, 0.34);
        tone("triangle", 760, 180, s + 0.03, 0.17, 0.24);
        tone("sine", 1700, 700, s + 0.07, 0.1, 0.18);
        noise(s, 0.24, 1200, 3800, 0.26, 0.8);
      }
      tone("sine", 520, 200, t + 0.52, 0.2, 0.16);
    },
    fuwa: function (t) {
      tone("sine", 392, 784, t, 0.55, 0.26);
      tone("triangle", 587, 1175, t + 0.1, 0.5, 0.14);
      tone("sine", 784, 1568, t + 0.22, 0.45, 0.09);
      noise(t, 0.6, 500, 1800, 0.06, 0.6);
    }
  };

  function play(name) {
    if (!audio()) return;
    try { SOUNDS[name](ac.currentTime + 0.02); } catch (e) {}
  }
  function blip() {
    if (!audio()) return;
    try { tone("triangle", 880, 1320, ac.currentTime + 0.02, 0.14, 0.12); } catch (e) {}
  }

  /* ============ エフェクト ============ */
  var particles = [];
  var dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 250); });
  resize();

  function rand(a, b) { return a + Math.random() * (b - a); }

  function burst(kind, x, y) {
    var i, n;
    if (kind === "star") {
      var cols = ["#fff3a8", "#ffe066", "#ffffff", "#9be7ff", "#ffb3e6"];
      for (i = 0, n = 16; i < n; i++) {
        var a = (Math.PI * 2 * i) / n + rand(-0.2, 0.2);
        var sp = rand(60, 260);
        particles.push({ t: "star", x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          g: 20, r: rand(9, 26), rot: rand(0, 6.3), vr: rand(-4, 4),
          life: 0, max: rand(0.8, 1.4), c: cols[i % cols.length] });
      }
    } else if (kind === "ball") {
      var bc = ["#ff6b8a", "#ffd23f", "#5b8cff", "#5fd1a0", "#ff9f45", "#c59bff"];
      for (i = 0, n = 11; i < n; i++) {
        particles.push({ t: "ball", x: x, y: y, vx: rand(-260, 260), vy: rand(-620, -240),
          g: 1100, r: rand(14, 32), rot: 0, vr: rand(-3, 3),
          life: 0, max: rand(1.1, 1.7), c: bc[i % bc.length] });
      }
    } else if (kind === "puff") {
      for (i = 0, n = 9; i < n; i++) {
        particles.push({ t: "puff", x: x + rand(-14, 14), y: y + rand(-10, 10),
          vx: rand(-150, -40), vy: rand(-70, -10), g: -25, r: rand(14, 30), grow: rand(30, 70),
          life: 0, max: rand(0.9, 1.5), c: "#ffffff" });
      }
    } else if (kind === "drop") {
      particles.push({ t: "ripple", x: x, y: y, r: 8, grow: 340, life: 0, max: 0.9, c: "#ffffff" });
      for (i = 0, n = 18; i < n; i++) {
        var ang = -Math.PI / 2 + rand(-1.15, 1.15);
        var s2 = rand(220, 560);
        particles.push({ t: "drop", x: x, y: y, vx: Math.cos(ang) * s2, vy: Math.sin(ang) * s2,
          g: 1300, r: rand(5, 13), life: 0, max: rand(0.8, 1.3),
          c: i % 4 === 0 ? "#ffffff" : "#7fe0ff" });
      }
    } else if (kind === "bubble") {
      var bu = ["rgba(255,255,255,.9)", "rgba(200,225,255,.9)", "rgba(255,210,240,.9)"];
      for (i = 0, n = 13; i < n; i++) {
        particles.push({ t: "bubble", x: x + rand(-40, 40), y: y + rand(-20, 20),
          vx: rand(-40, 40), vy: rand(-130, -50), g: 10, r: rand(12, 34),
          ph: rand(0, 6.3), life: 0, max: rand(1.6, 2.6), c: bu[i % bu.length] });
      }
    }
  }

  function drawStar(x, y, r, rot, color, alpha) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = alpha;
    ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 16;
    var k = r * 0.24;
    ctx.beginPath();
    ctx.moveTo(0, -r); ctx.quadraticCurveTo(k, -k, r, 0);
    ctx.quadraticCurveTo(k, k, 0, r); ctx.quadraticCurveTo(-k, k, -r, 0);
    ctx.quadraticCurveTo(-k, -k, 0, -r);
    ctx.fill();
    ctx.restore();
  }

  var last = 0;
  function frame(now) {
    var dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
    last = now;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life += dt;
      if (p.life >= p.max) { particles.splice(i, 1); continue; }
      var k = p.life / p.max;
      var alpha = k < 0.75 ? 1 : 1 - (k - 0.75) / 0.25;

      if (p.t === "ripple") {
        p.r += p.grow * dt;
        ctx.save(); ctx.globalAlpha = alpha * 0.8;
        ctx.strokeStyle = p.c; ctx.lineWidth = Math.max(1, 9 * (1 - k));
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * 0.42, 0, 0, 6.2832); ctx.stroke();
        ctx.restore();
        continue;
      }

      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.vr) p.rot += p.vr * dt;

      if (p.t === "star") {
        var sc = k < 0.2 ? k / 0.2 : 1;
        drawStar(p.x, p.y, p.r * sc, p.rot, p.c, alpha);
      } else if (p.t === "ball") {
        ctx.save(); ctx.globalAlpha = alpha;
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
        ctx.globalAlpha = alpha * 0.7; ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(p.x - p.r * 0.3, p.y - p.r * 0.32, p.r * 0.24, 0, 6.2832); ctx.fill();
        ctx.restore();
      } else if (p.t === "puff") {
        ctx.save(); ctx.globalAlpha = alpha * 0.75;
        ctx.fillStyle = p.c;
        var pr = p.r + p.grow * k;
        ctx.beginPath(); ctx.arc(p.x, p.y, pr, 0, 6.2832); ctx.fill();
        ctx.restore();
      } else if (p.t === "drop") {
        ctx.save(); ctx.globalAlpha = alpha;
        ctx.fillStyle = p.c;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.r * 0.8, p.r * 1.15, Math.atan2(p.vy, p.vx) + Math.PI / 2, 0, 6.2832);
        ctx.fill();
        ctx.restore();
      } else if (p.t === "bubble") {
        var wob = Math.sin(p.life * 3 + p.ph) * 22;
        ctx.save(); ctx.globalAlpha = alpha;
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x + wob, p.y, p.r, 0, 6.2832); ctx.fill();
        ctx.globalAlpha = alpha * 0.9; ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineWidth = 2;
        ctx.stroke();
        ctx.globalAlpha = alpha; ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(p.x + wob - p.r * 0.34, p.y - p.r * 0.36, p.r * 0.2, 0, 6.2832); ctx.fill();
        ctx.restore();
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ============ タップ ============ */
  var lastTap = 0;
  function tap(x, y) {
    var now = Date.now();
    if (now - lastTap < 110) return;
    lastTap = now;
    var s = SCENES[current];

    burst(s.particle, x, y);
    play(s.sound);

    wordEl.textContent = s.word;
    wordEl.style.color = s.color;
    wordEl.classList.remove("pop");
    void wordEl.offsetWidth;
    wordEl.classList.add("pop");

    if (s.react) {
      var target = s.el.querySelector(s.react);
      if (target) {
        target.classList.remove(s.reactClass);
        void target.getBoundingClientRect();
        target.classList.add(s.reactClass);
      }
    }
  }

  var down = null;
  var app = document.getElementById("app");

  app.addEventListener("pointerdown", function (e) {
    if (e.target.closest("button")) return;
    down = { x: e.clientX, y: e.clientY, t: Date.now() };
  });
  app.addEventListener("pointerup", function (e) {
    if (e.target.closest("button")) return;
    if (!down) { tap(e.clientX, e.clientY); return; }
    var dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)) {
      show(current + (dx < 0 ? 1 : -1));
      blip();
    } else {
      tap(e.clientX, e.clientY);
    }
    down = null;
  });
  app.addEventListener("pointercancel", function () { down = null; });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  document.getElementById("prev").addEventListener("click", function (e) {
    e.stopPropagation(); show(current - 1); blip();
  });
  document.getElementById("next").addEventListener("click", function (e) {
    e.stopPropagation(); show(current + 1); blip();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { show(current + 1); blip(); }
    if (e.key === "ArrowLeft") { show(current - 1); blip(); }
  });

  startEl.addEventListener("click", function () {
    audio();
    startEl.classList.add("hide");
    blip();
  });

  show(0);
})();
</script>
</body>
</html>
