<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>おうちのアプリ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; min-height:100%; background:#fdf6e3;
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Hiragino Sans",sans-serif;
    color:#3c3a34; -webkit-user-select:none; user-select:none; }
  body { background:
      radial-gradient(circle at 12% 18%, #ffe9a8 0 3vh, transparent 3vh),
      radial-gradient(circle at 88% 12%, #cfeecf 0 4vh, transparent 4vh),
      radial-gradient(circle at 80% 88%, #ffd6cc 0 5vh, transparent 5vh),
      linear-gradient(#fff9ec, #fdf0d5);
    background-attachment:fixed;
    padding:max(4vh, env(safe-area-inset-top)) 5vw 6vh; }

  h1 { text-align:center; font-size:min(5.5vh, 7vw); font-weight:900; letter-spacing:.05em;
       color:#6b5a3e; margin-bottom:1vh; }
  p.lead { text-align:center; font-size:min(2.6vh, 3.6vw); color:#8b7c62; margin-bottom:4vh; }

  .grid { display:flex; flex-wrap:wrap; gap:3vh; justify-content:center;
          max-width:1000px; margin:0 auto; }
  a.tile { flex:1 1 320px; max-width:460px; display:flex; align-items:center; gap:3vw;
           text-decoration:none; color:inherit; background:#fff;
           border:0.6vh solid var(--c); border-radius:4vh;
           padding:3vh 4vw; box-shadow:0 1.2vh 0 rgba(0,0,0,.08);
           transition:transform .12s, box-shadow .12s; }
  a.tile:active { transform:translateY(0.8vh); box-shadow:0 0.4vh 0 rgba(0,0,0,.08); }
  .icon { flex:0 0 auto; width:min(13vh, 22vw); }
  .icon svg { width:100%; height:auto; display:block; }
  .label { font-size:min(4.4vh, 6vw); font-weight:900; line-height:1.3; }
  .sub { font-size:min(2.4vh, 3.4vw); font-weight:700; color:#8b7c62; margin-top:.6vh; }
</style>
</head>
<body>

<h1>おうちの アプリ</h1>
<p class="lead">あそびたい ものを えらんでね</p>

<div class="grid">

  <!-- ▼ くるま：リンク先はファイルの置き場所に合わせて変えてください -->
  <a class="tile" href="kuruma.html" style="--c:#3d8fd6">
    <span class="icon">
      <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M6 66 H114" stroke="#c9ced6" stroke-width="6" stroke-linecap="round"/>
        <rect x="14" y="32" width="86" height="24" rx="8" fill="#3d8fd6"/>
        <path d="M30 32 L42 18 L74 18 L86 32 Z" fill="#6fb3ea"/>
        <rect x="44" y="21" width="26" height="11" rx="3" fill="#e4f3ff"/>
        <circle cx="38" cy="58" r="10" fill="#2b2f36"/><circle cx="38" cy="58" r="4" fill="#e8eaed"/>
        <circle cx="82" cy="58" r="10" fill="#2b2f36"/><circle cx="82" cy="58" r="4" fill="#e8eaed"/>
        <path d="M100 40 H112 M100 48 H108" stroke="#a9c9e4" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </span>
    <span>
      <span class="label">くるま</span>
      <span class="sub">ゆびで はしらせる</span>
    </span>
  </a>

  <!-- ▼ くるまのかずあそび：リンク先はファイルの置き場所に合わせて変えてください -->
  <a class="tile" href="kuruma-kazu.html" style="--c:#ff7a3d">
    <span class="icon">
      <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="8" y="34" width="104" height="26" rx="6" fill="#e23b32"/>
        <rect x="76" y="18" width="34" height="20" rx="5" fill="#e23b32"/>
        <rect x="82" y="23" width="22" height="12" rx="3" fill="#bfe6f7"/>
        <rect x="14" y="24" width="52" height="11" rx="4" fill="#c9ced6"/>
        <rect x="8" y="46" width="104" height="5" fill="#f6f2e8"/>
        <circle cx="34" cy="62" r="11" fill="#2b2f36"/><circle cx="34" cy="62" r="5" fill="#e8eaed"/>
        <circle cx="90" cy="62" r="11" fill="#2b2f36"/><circle cx="90" cy="62" r="5" fill="#e8eaed"/>
      </svg>
    </span>
    <span>
      <span class="label">くるまの<br>かずあそび</span>
      <span class="sub">タップで 1・2・3</span>
    </span>
  </a>

  <!-- ▼ えほん：リンク先はファイルの置き場所に合わせて変えてください -->
  <a class="tile" href="ehon.html" style="--c:#4aa86a">
    <span class="icon">
      <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M60 18 C46 8 26 10 14 16 L14 66 C26 60 46 58 60 68 Z" fill="#fffdf4" stroke="#4aa86a" stroke-width="4" stroke-linejoin="round"/>
        <path d="M60 18 C74 8 94 10 106 16 L106 66 C94 60 74 58 60 68 Z" fill="#fffdf4" stroke="#4aa86a" stroke-width="4" stroke-linejoin="round"/>
        <g stroke="#bcd8c4" stroke-width="3" stroke-linecap="round">
          <path d="M24 28 H48"/><path d="M24 38 H48"/><path d="M24 48 H42"/>
          <path d="M72 28 H96"/><path d="M72 38 H96"/><path d="M72 48 H90"/>
        </g>
      </svg>
    </span>
    <span>
      <span class="label">えほんの<br>ほんだな</span>
      <span class="sub">よみたい ほんを えらぶ</span>
    </span>
  </a>

  <!-- ▼ おとのずかん：リンク先はファイルの置き場所に合わせて変えてください -->
  <a class="tile" href="onomatope.html" style="--c:#8a63d2">
    <span class="icon">
      <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="10" y="10" width="100" height="60" rx="12" fill="#2f2a55"/>
        <circle cx="30" cy="26" r="2.6" fill="#fff"/><circle cx="52" cy="18" r="2" fill="#fff"/>
        <circle cx="88" cy="22" r="2.4" fill="#fff"/><circle cx="96" cy="46" r="2" fill="#fff"/>
        <circle cx="24" cy="50" r="2" fill="#fff"/>
        <path d="M60 22 C62 34 66 38 78 40 C66 42 62 46 60 58 C58 46 54 42 42 40 C54 38 58 34 60 22 Z" fill="#ffe066"/>
        <path d="M92 60 C93 66 95 68 100 69 C95 70 93 72 92 76 C91 72 89 70 84 69 C89 68 91 66 92 60 Z" fill="#9be7ff"/>
        <path d="M26 62 C27 66 28 67 32 68 C28 69 27 70 26 74 C25 70 24 69 20 68 C24 67 25 66 26 62 Z" fill="#ffb3e6"/>
      </svg>
    </span>
    <span>
      <span class="label">おとの<br>ずかん</span>
      <span class="sub">タップで キラキラ ポンポン</span>
    </span>
  </a>

</div>

</body>
</html>
