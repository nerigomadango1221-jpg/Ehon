<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f0d9b0">
<title>なにで あそぶ？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f0d9b0;
    --bg2:#e3c795;
    --panel:#fffdf6;
    --ink:#4a3a24;
    --ink-soft:#8a7658;
    --shadow:rgba(110,80,40,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#3a2f22; --bg2:#31281d; --panel:#4a4034;
      --ink:#f7efe1; --ink-soft:#c8b79c; --shadow:rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#3a2f22; --bg2:#31281d; --panel:#4a4034;
    --ink:#f7efe1; --ink-soft:#c8b79c; --shadow:rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 2px, transparent 2px 13px),
      linear-gradient(180deg, var(--bg), var(--bg2));
    color:var(--ink);
    font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",system-ui,-apple-system,sans-serif;
    font-weight:800;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(16px,3.5vh,30px);
    padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-left))
            max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-right));
    overflow:hidden;
  }
  h1{
    margin:0;
    font-size:clamp(24px,5.2vw,40px);
    letter-spacing:.04em;
    text-shadow:0 3px 0 var(--shadow);
  }
  .menu{
    display:grid;gap:clamp(12px,2.4vw,22px);
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    width:min(1000px,100%);
  }
  .tile{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    background:var(--panel);
    border-radius:28px;
    padding:clamp(12px,2.2vh,22px) 12px clamp(12px,2vh,18px);
    box-shadow:0 7px 0 var(--shadow);
    text-decoration:none;color:var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .tile:active{transform:translateY(6px);box-shadow:0 1px 0 var(--shadow)}
  .tile:focus-visible{outline:5px solid #ff8a3d;outline-offset:4px}
  .tile svg{width:100%;max-width:190px;height:auto;display:block}
  .tile .name{font-size:clamp(17px,3.4vw,23px)}
  .tile[hidden]{display:none}
  .note{margin:0;color:var(--ink-soft);font-size:13px;font-weight:700}
  @media (prefers-reduced-motion:reduce){ .tile{transition:none} }
</style>
</head>
<body>
  <h1>なにで あそぶ？</h1>

  <nav class="menu" id="menu">
    <a class="tile" href="ehon.html" data-check="ehon.html">
      <svg viewBox="0 0 120 84" aria-hidden="true">
        <ellipse cx="60" cy="77" rx="46" ry="5" fill="rgba(110,80,40,.18)"/>
        <path d="M60 18C47 9 29 9 15 15v52c14-6 32-6 45 3z" fill="#fff6e2" stroke="#c07a3a" stroke-width="4" stroke-linejoin="round"/>
        <path d="M60 18c13-9 31-9 45-3v52c-14-6-32-6-45 3z" fill="#fff6e2" stroke="#c07a3a" stroke-width="4" stroke-linejoin="round"/>
        <path d="M60 18v52" stroke="#c07a3a" stroke-width="4" stroke-linecap="round"/>
        <path d="M26 30h22M26 42h22M72 30h22M72 42h22" stroke="#f0c78e" stroke-width="5" stroke-linecap="round"/>
        <circle cx="37" cy="56" r="6" fill="#ff8fb1"/>
        <circle cx="83" cy="56" r="6" fill="#5ad2a0"/>
      </svg>
      <span class="name">えほん</span>
    </a>

    <a class="tile" href="kuruma.html" data-check="kuruma.html">
      <svg viewBox="0 0 120 84" aria-hidden="true">
        <ellipse cx="60" cy="77" rx="46" ry="5" fill="rgba(110,80,40,.18)"/>
        <path d="M12 68c26 0 16-30 42-30s18-26 54-26" fill="none" stroke="#6d6a66" stroke-width="20" stroke-linecap="round"/>
        <path d="M12 68c26 0 16-30 42-30s18-26 54-26" fill="none" stroke="#fdf6e3" stroke-width="3" stroke-dasharray="7 9" stroke-linecap="round"/>
        <g transform="translate(46 44) rotate(-42)">
          <rect x="-17" y="-10" width="34" height="20" rx="6" fill="#e8483c" stroke="#c2372d" stroke-width="2"/>
          <rect x="3" y="-7" width="6" height="14" rx="2" fill="#bfe4ef"/>
          <rect x="-9" y="-7" width="9" height="14" rx="3" fill="#c2372d"/>
          <rect x="14" y="-8" width="3" height="5" rx="1" fill="#fff3c4"/>
          <rect x="14" y="3" width="3" height="5" rx="1" fill="#fff3c4"/>
        </g>
        <g transform="translate(96 22)">
          <rect x="-2" y="0" width="4" height="14" rx="2" fill="#9aa3ad"/>
          <rect x="-12" y="-16" width="24" height="18" rx="6" fill="#f7b32b"/>
          <text x="0" y="-3" text-anchor="middle" font-family="inherit" font-size="14" font-weight="800" fill="#7a4b12">8</text>
        </g>
      </svg>
      <span class="name">くるまで おでかけ</span>
    </a>

    <a class="tile" href="kuruma-kazu.html" data-check="kuruma-kazu.html">
      <svg viewBox="0 0 120 84" aria-hidden="true">
        <ellipse cx="60" cy="77" rx="46" ry="5" fill="rgba(110,80,40,.18)"/>
        <rect x="10" y="60" width="100" height="8" rx="4" fill="#9ccf7f"/>
        <g font-family="inherit" font-weight="800" font-size="30" text-anchor="middle">
          <text x="26" y="34" fill="#3b6fd4">1</text>
          <text x="60" y="26" fill="#e8483c">2</text>
          <text x="94" y="34" fill="#f7b32b">3</text>
        </g>
        <g transform="translate(60 50)">
          <rect x="-24" y="-9" width="48" height="19" rx="6" fill="#d9261c" stroke="#a81c14" stroke-width="2"/>
          <rect x="6" y="-6" width="7" height="13" rx="2" fill="#f2f4f6"/>
          <rect x="-20" y="-13" width="26" height="5" rx="2" fill="#d8dce0"/>
          <circle cx="-12" cy="11" r="5" fill="#2f3237"/>
          <circle cx="12" cy="11" r="5" fill="#2f3237"/>
        </g>
      </svg>
      <span class="name">くるまの かずあそび</span>
    </a>
  </nav>

  <p class="note" id="note" hidden>あそびが みつかりません</p>

<script>
(() => {
  "use strict";
  // 置いていないファイルのカードは出さない（GitHub Pages で確認）
  const tiles = [...document.querySelectorAll(".tile")];
  const note = document.getElementById("note");
  if(location.protocol === "http:" || location.protocol === "https:"){
    Promise.all(tiles.map(async tile => {
      try{
        const res = await fetch(tile.dataset.check, {method:"HEAD"});
        if(!res.ok) tile.hidden = true;
      }catch(e){ /* 確認できないときは出したままにする */ }
    })).then(() => {
      note.hidden = tiles.some(t => !t.hidden);
    });
  }
})();
</script>
</body>
</html>
